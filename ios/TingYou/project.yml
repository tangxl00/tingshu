name: TingYou
targets:
  TingYou:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TingYou
    resources:
      - path: TingYou/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tingyou.app.ios
        MARKETING_VERSION: 1.4.4
        CURRENT_PROJECT_VERSION: 48
        INFOPLIST_FILE: TingYou/Info.plist
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: TingYou/Info.plist
      properties:
        CFBundleShortVersionString: "1.4.4"
        CFBundleVersion: "48"
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    dependencies: []
  TingYouTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TingYouTests
    dependencies:
      - target: TingYou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tingyou.app.ios.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
  # build 42 · 任务一：XCUITest target——用 CI 模拟器真实点击拿
  # 「点书不导航」的运行时证据（DiscoverNavigationUITests 用例 A/B/C）。
  # 已挂入 TingYou scheme 的 Test action：CI 跑 xcodebuild test 即执行
  # （若 workflow 用 -only-testing 限定 TingYouTests 则不会跑，需组长核验）。
  TingYouUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TingYouUITests
    dependencies:
      - target: TingYou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tingyou.app.ios.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TingYou
schemes:
  TingYou:
    build:
      targets:
        TingYou: all
    test:
      targets:
        - name: TingYouTests
          parallelizable: true
        - name: TingYouUITests
          parallelizable: false
      commandLineArguments:
        "-UITesting": true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
