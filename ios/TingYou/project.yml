name: TingYou
targets:
  TingYou:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TingYou
    resources:
      - path: TingYou/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tingyou.app.ios
        MARKETING_VERSION: 1.4.4
        CURRENT_PROJECT_VERSION: 36
        INFOPLIST_FILE: TingYou/Info.plist
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: TingYou/Info.plist
      properties:
        CFBundleShortVersionString: "1.4.4"
        CFBundleVersion: "36"
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    dependencies: []
  TingYouTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TingYouTests
    dependencies:
      - target: TingYou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tingyou.app.ios.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TingYou:
    build:
      targets:
        TingYou: all
    test:
      targets:
        - name: TingYouTests
          parallelizable: true
      commandLineArguments:
        "-UITesting": true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
