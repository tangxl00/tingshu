name: iOS Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 40

    env:
      SCHEME: TingYou
      CONFIGURATION: Release
      DERIVED_DATA: ${{ github.workspace }}/build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios/TingYou
        run: xcodegen generate

      - name: List schemes
        working-directory: ios/TingYou
        run: xcodebuild -list -project TingYou.xcodeproj

      - name: Build (unsigned)
        working-directory: ios/TingYou
        run: |
          set -o pipefail
          xcodebuild \
            -project TingYou.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Test (ad-hoc signed simulator)
        if: success()
        working-directory: ios/TingYou
        run: |
          set -o pipefail
          # Dynamically pick the first available iPhone simulator UDID
          SIM_UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([A-F0-9a-f-]{36})\).*/\1/')
          if [ -n "$SIM_UDID" ]; then
            DEST="id=$SIM_UDID"
          else
            DEST="platform=iOS Simulator,name=iPhone 16"
          fi
          echo "Test destination: $DEST"
          xcodebuild \
            -project TingYou.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$DEST" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            test 2>&1 | tee test.log

      - name: Archive (unsigned .xcarchive)
        if: success()
        working-directory: ios/TingYou
        run: |
          set -o pipefail
          mkdir -p "$DERIVED_DATA/archive"
          xcodebuild \
            -project TingYou.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            -archivePath "$DERIVED_DATA/archive/TingYou.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee archive.log

      - name: Package .app
        if: success()
        working-directory: ios/TingYou
        run: |
          set -o pipefail
          APP_PATH="$DERIVED_DATA/archive/TingYou.xcarchive/Products/Applications/TingYou.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found at $APP_PATH"
            ls -la "$DERIVED_DATA/archive/TingYou.xcarchive/Products/" || true
            exit 1
          fi
          mkdir -p artifact
          cp -R "$APP_PATH" artifact/TingYou.app
          cd artifact
          zip -qr TingYou-unsigned-1.3.3-16.zip TingYou.app
          ls -la
          du -h TingYou-unsigned-1.3.3-16.zip

      - name: Verify Info.plist keys in archive
        if: success()
        working-directory: ios/TingYou
        run: |
          set -euo pipefail
          PLIST="$DERIVED_DATA/archive/TingYou.xcarchive/Products/Applications/TingYou.app/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::error::Archived Info.plist not found at $PLIST"
            exit 1
          fi
          echo "--- Archived Info.plist ---"
          plutil -p "$PLIST" | grep -iE "UIBackgroundModes|NSAppTransportSecurity|NSAllowsArbitraryLoads|UIRequiredDeviceCapabilities|CFBundleShortVersionString|CFBundleVersion" || true
          BG=$(plutil -extract UIBackgroundModes json -o - "$PLIST")
          if [[ "$BG" != *'"audio"'* ]]; then
            echo "::error::UIBackgroundModes is missing 'audio' in archived Info.plist"
            exit 1
          fi
          ATS=$(plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoads raw -o - "$PLIST")
          if [[ "$ATS" != "false" ]]; then
            echo "::error::NSAppTransportSecurity.NSAllowsArbitraryLoads is not false in archived Info.plist"
            exit 1
          fi
          echo "Info.plist keys verified: UIBackgroundModes=audio, ATS configured."

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TingYou-unsigned-${{ github.sha }}
          path: ios/TingYou/artifact/TingYou-unsigned-1.3.3-16.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            ios/TingYou/build.log
            ios/TingYou/test.log
            ios/TingYou/archive.log
          if-no-files-found: warn
          retention-days: 7
