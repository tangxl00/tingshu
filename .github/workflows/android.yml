name: Android APK

on:
  push:
    branches: [main, "android/**", "feat/android-**"]
    tags: ['v*']
    paths:
      - 'android_app/**'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: android_app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.38.10 (matches project AGP 8.11.1 / Gradle 8.14)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      # 可选：配置过签名密钥时用它构建，保证跨版本可覆盖安装。
      # 未配置则沿用 debug 签名，仅用于本地验证，不建议作为长期更新源。
      - name: Restore release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ../android/app
            printf '%s' "$KEYSTORE_B64" | base64 -d > ../android/app/release.jks
            cat > ../android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/release.jks
          EOF
            echo "Release keystore restored"
          else
            echo "::warning::未配置签名密钥，本次使用 debug 签名；跨版本覆盖安装可能失败"
          fi

      - name: Analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Prepare artifact
        run: |
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../artifacts/tingyou-android-release.apk
          ls -lh ../artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tingyou-android-apk
          path: artifacts/tingyou-android-release.apk
          if-no-files-found: error
          retention-days: 90

      # 打 tag 时创建 Release 并附上 APK：App 内「检查更新」读取 latest release。
      # release notes 由 GitHub 自动生成，直接作为弹窗里的更新说明展示。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 听书 ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/tingyou-android-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
