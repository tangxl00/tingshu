name: Android APK

on:
  push:
    branches: [main, "android/**", "feat/android-**"]
    paths:
      - 'android_app/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: android_app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.38.10 (matches project AGP 8.11.1 / Gradle 8.14)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare artifact
        run: |
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../artifacts/tingyou-android-release.apk
          ls -lh ../artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tingyou-android-apk
          path: artifacts/tingyou-android-release.apk
          if-no-files-found: error
          retention-days: 90
